apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-green
  namespace: piggymetrics
  labels: { app: auth-service, color: green }
spec:
  replicas: 0
  selector: { matchLabels: { app: auth-service, color: green } }
  template:
    metadata: { labels: { app: auth-service, color: green } }
    spec:
      containers:
        - name: auth-service
          image: piggymetrics-auth-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5000 }]
          envFrom: [{ secretRef: { name: piggymetrics-secrets } }]
          readinessProbe: { tcpSocket: { port: 5000 }, initialDelaySeconds: 30, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe: { tcpSocket: { port: 5000 }, initialDelaySeconds: 60, periodSeconds: 20 }
