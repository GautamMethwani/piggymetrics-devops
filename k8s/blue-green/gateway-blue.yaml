apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-blue
  namespace: piggymetrics
  labels: { app: gateway, color: blue }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway, color: blue } }
  template:
    metadata: { labels: { app: gateway, color: blue } }
    spec:
      containers:
        - name: gateway
          image: piggymetrics-gateway:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          envFrom: [{ secretRef: { name: piggymetrics-secrets } }]
          readinessProbe: { tcpSocket: { port: 4000 }, initialDelaySeconds: 30, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe: { tcpSocket: { port: 4000 }, initialDelaySeconds: 60, periodSeconds: 20 }
