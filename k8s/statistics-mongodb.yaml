apiVersion: apps/v1
kind: Deployment
metadata: { name: statistics-mongodb, namespace: piggymetrics }
spec:
  replicas: 1
  selector: { matchLabels: { app: statistics-mongodb } }
  template:
    metadata: { labels: { app: statistics-mongodb } }
    spec:
      containers:
        - name: mongodb
          image: piggymetrics-mongodb:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 27017 }]
          envFrom: [{ secretRef: { name: piggymetrics-secrets } }]
          readinessProbe: { tcpSocket: { port: 27017 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: statistics-mongodb, namespace: piggymetrics }
spec:
  selector: { app: statistics-mongodb }
  ports: [{ port: 27017, targetPort: 27017 }]
