apiVersion: apps/v1
kind: Deployment
metadata: { name: registry, namespace: piggymetrics }
spec:
  replicas: 1
  selector: { matchLabels: { app: registry } }
  template:
    metadata: { labels: { app: registry } }
    spec:
      containers:
        - name: registry
          image: piggymetrics-registry:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8761 }]
          envFrom: [{ secretRef: { name: piggymetrics-secrets } }]
          readinessProbe: { tcpSocket: { port: 8761 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 8761 }, initialDelaySeconds: 40, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: registry, namespace: piggymetrics }
spec:
  selector: { app: registry }
  ports: [{ port: 8761, targetPort: 8761 }]
